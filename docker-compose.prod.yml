version: '3.8'

services:
  backend:
    image: ghcr.io/icdevgpasa/clawgs-backend:latest
    ports:
      - "8010:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SQLALCHEMY_DATABASE_URI=sqlite:///./data/ai_gateway.db
      - FRONTEND_URL=https://clawgs.lisowska26.com
    volumes:
      - backend_data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    image: ghcr.io/icdevgpasa/clawgs-frontend:latest
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  backend_data:
  redis_data:
